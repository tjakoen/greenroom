# Greenroom CI — runs the bun test suite (unit + booted-server integration) on push/PR.
#
# No registry token needed: the shared layer (@tjakoen/batch · grain · mill · proof) is published
# to the public npm registry, so a plain `bun install` resolves anonymously.
#
# Use bun, not npm: @tjakoen/pantry is gone, but bun stays the supported installer for this repo
# (see package.json "//dependencies").
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run check
      - name: Install Chromium for Playwright-backed tests
        run: bunx playwright install --with-deps chromium
      - name: Unit + integration tests
        run: bun test lib
