# Greenroom CI — runs the bun test suite (unit + booted-server integration) on push/PR.
#
# DORMANT BY DEFAULT. It only runs once you set the repository variable `CI_ENABLED=true`
# (Settings → Secrets and variables → Actions → Variables) AND provide `GH_PACKAGES_TOKEN`
# (a token with read:packages for the @tjakoen scope — see .npmrc / DEPLOY.md). Until then the
# job is skipped so it never red-X'es a push while the install story is being finished.
#
# Why not a plain `bun install`? A full dev install still hits the nested @tjakoen/pantry git-dep
# wall (package.json "//dependencies"). `bun install --production` skips pantry (a devDep, only the
# component catalog) and resolves the published @tjakoen/* packages from GitHub Packages with the
# token — the same path DEPLOY.md documents — so `bun test` has everything it needs at runtime.
# The tsc typecheck (`bun run check`) needs the dev toolchain and is left to the reproducible-build
# follow-up (plans/platform.md §10); add it as a second step once a full install resolves cleanly.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install runtime deps (GitHub Packages, @tjakoen scope)
        run: bun install --production
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - name: Install Chromium for Playwright-backed tests
        run: bunx playwright install --with-deps chromium
      - name: Unit + integration tests
        run: bun test lib
